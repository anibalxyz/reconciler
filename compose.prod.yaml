services:
  api:
    pull_policy: always
    environment:
      # Not used yet
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS},${DOMAIN}
  db:
    ports: !reset []
  nginx:
    image: anibalxyz/reconciler-prod-nginx:latest
    container_name: reconciler-prod-nginx
    pull_policy: always
    environment:
      - NGINX_TTL=${NGINX_TTL}
      - DOMAIN=${DOMAIN}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - API_PORT=${API_PORT}
      - API_PREFIX=${API_PREFIX}
      - LIMIT_REQ_RATE=${LIMIT_REQ_RATE}
      - LIMIT_REQ_BURST=${LIMIT_REQ_BURST}
      # Used when running in the same Docker network. Change it in real production
      - API_HOST=api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot:ro
    networks:
      - main
  certbot:
    image: certbot/certbot:latest
    container_name: reconciler-prod-certbot
    restart: no
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./scripts/cert-entry.sh:/entrypoint.sh:ro
    environment:
      - DOMAIN=${DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - CERTBOT_STAGING=${CERTBOT_STAGING}
    entrypoint: /bin/sh
    command: /entrypoint.sh
    networks:
      - main

volumes:
  certbot-etc:
    name: reconciler-prod-certbot-etc
  certbot-www:
    name: reconciler-prod-certbot-www
