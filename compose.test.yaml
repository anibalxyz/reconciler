services:
  api:
    pull_policy: never
    ports: !reset []
    volumes:
      # Persist Maven dependencies cache to speed up builds
      - maven:/root/.m2
      # Testcontainers needs the Docker socket to boot sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
    # Enable colored output
    tty: true
    stdin_open: true

volumes:
  maven:
    name: "reconciler-test-mvn"
