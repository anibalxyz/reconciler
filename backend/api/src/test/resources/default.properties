# ---------------------------------------------- #
# ==> In-code test defaults (resource)           #
# ---------------------------------------------- #
# Base values for tests. Overridden per key by   #
# -DenvFile=<path> or -DuseSystemEnv=true.       #
# Application Configuration
APP_ENV=test
API_PROTOCOL=http
API_HOST=localhost
API_PORT=1
CORS_ALLOWED_ORIGINS=
# Available: TRACE, DEBUG, INFO, WARN, ERROR, OFF
LOG_LEVEL=INFO
CONTACT_EMAIL=anibalboggioict@gmail.com
SYSTEM_TIMEZONE=America/Montevideo
# Format: ISO 8601 date-time (e.g., 2026-05-12T00:00:00Z)
SYSTEM_TIME_OVERRIDE=
# Feature Flags
FF_SWAGGER=false
# Database Configuration
# This value NEED to come from the external environment (file or system env)
# TODO: I plan to use TestContainers + embedded Flyway, so this values won't be needed
DB_HOST=localhost
DB_PORT=5435
DB_NAME=reconciler
DB_USER=my-user
DB_PASSWORD=secretpass
HIKARI_MAX_SIZE=5
HIKARI_MIN_IDLE_SIZE=2
HIKARI_ACQUISITION_TIMEOUT=15000
HIKARI_VALIDATION_TIMEOUT=5000
HIKARI_INITIALIZATION_TIMEOUT=60000
HIKARI_IDLE_TIMEOUT=300000
# JWT Configuration
JWT_SECRET=some_secret_greather_than_32_bytes
JWT_ISSUER=reconciler_backend
JWT_ACCESS_EXPIRATION_TIME_MINUTES=15
JWT_REFRESH_EXPIRATION_TIME_DAYS=1
BCRYPT_LOG_ROUNDS=4
# Authentication Cookie
AUTH_COOKIE_DOMAIN=
AUTH_COOKIE_SAMESITE=Strict
AUTH_COOKIE_PATH=/auth