services:
  promtail:
    image: grafana/promtail:3.4.2
    container_name: reconciler-${APP_ENV}-promtail
    pull_policy: always
    command:
      - -config.file=/etc/promtail/promtail-config.yaml
      - -config.expand-env=true
    environment:
      - APP_ENV=${APP_ENV}
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - main

  loki:
    image: grafana/loki:3.4.2
    container_name: reconciler-${APP_ENV}-loki
    pull_policy: always
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - main

  prometheus:
    image: anibalxyz/reconciler-prod-prometheus:latest
    container_name: reconciler-${APP_ENV}-prometheus
    pull_policy: always
    environment:
      - API_PORT=${API_PORT}
    volumes:
      - prometheus-data:/prometheus
    networks:
      - main

  # TODO: configure dashboards to load labels on time range change
  grafana:
    image: grafana/grafana:11.6.0
    container_name: reconciler-${APP_ENV}-grafana
    pull_policy: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # TODO: solve alert when running in dev: DOMAIN not set
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - main

volumes:
  loki-data:
    name: reconciler-${APP_ENV}-loki-data
  prometheus-data:
    name: reconciler-${APP_ENV}-prometheus-data
  grafana-data:
    name: reconciler-${APP_ENV}-grafana-data
