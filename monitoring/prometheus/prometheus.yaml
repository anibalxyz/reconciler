global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: reconciler-api
    static_configs:
      - targets:
          - api:4001
    metrics_path: /internal/metrics

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: promtail
    static_configs:
      - targets:
          - promtail:9080
